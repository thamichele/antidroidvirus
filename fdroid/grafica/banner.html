<!DOCTYPE html>
<!-- Immagine in evidenza di F-Droid (1024x500). Si rigenera con fdroid/grafica/genera.js. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body { background: #1C1B1A; color: #EDEAE3; font-family: Inter, sans-serif;
         display: flex; align-items: center; gap: 48px; padding: 0 64px; box-sizing: border-box;
         background-image: radial-gradient(circle at 18% 50%, rgba(227,132,90,.16), transparent 42%); }
  .scudo { width: 210px; height: 210px; flex: none; }
  h1 { font-size: 64px; font-weight: 700; letter-spacing: -1.5px; margin: 0 0 14px; }
  p { font-size: 26px; line-height: 1.35; color: #A39E95; margin: 0 0 28px; }
  .pillole { display: flex; gap: 10px; }
  .pillole span { font-size: 18px; font-weight: 500; padding: 8px 16px; border-radius: 999px;
                  border: 1.5px solid #3A3734; background: #252422; color: #EDEAE3; }
  .pillole span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%;
                          background: #5DB3A6; margin-right: 10px; vertical-align: 2px; }
</style></head><body>
  <svg class="scudo" viewBox="0 0 24 24" fill="none" stroke="#E3845A" stroke-width="1.75"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M12,3l7,3v5c0,4.5 -3,8.3 -7,10c-4,-1.7 -7,-5.5 -7,-10V6z"/><path d="M9,12l2,2l4,-4"/>
  </svg>
  <div>
    <h1>AntiDroidVirus</h1>
    <p>Registra chi usa i permessi, segnala le app<br>sospette e controlla download e installazioni.</p>
    <div class="pillole"><span>Senza internet</span><span>Senza root</span><span>Shizuku facoltativo</span></div>
  </div>
</body></html>
