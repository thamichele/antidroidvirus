<!DOCTYPE html>
<!-- Immagine in evidenza di F-Droid (1024x500), stile Arancio UI. Si rigenera con fdroid/grafica/genera.js. -->
<html><head><meta charset="utf-8"><style>
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url(../../app/src/main/res/font/jetbrains_mono_regular.ttf); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url(../../app/src/main/res/font/jetbrains_mono_medium.ttf); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 600; src: url(../../app/src/main/res/font/jetbrains_mono_semibold.ttf); }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body { background: #1C1B1A; color: #EDEAE3; font-family: "JetBrains Mono", monospace;
         display: flex; align-items: center; gap: 56px; padding: 0 64px; box-sizing: border-box; }
  .icona { width: 200px; height: 200px; flex: none; border-radius: 24px; border: 2px solid #45413D;
           box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
  .icona svg { width: 182px; height: 182px; }
  h1 { font-size: 54px; font-weight: 600; letter-spacing: -1.5px; margin: 0 0 14px; }
  p { font-size: 22px; line-height: 1.45; color: #A39E95; margin: 0 0 28px; }
  .etichette { display: flex; gap: 10px; }
  .etichette span { font-size: 16px; font-weight: 500; padding: 8px 14px; border-radius: 4px;
                    border: 1.5px solid #3A3734; background: #252422; color: #EDEAE3; }
  .etichette span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%;
                            background: #5DB3A6; margin-right: 10px; vertical-align: 2px; }
</style></head><body>
  <div class="icona">
    <svg viewBox="0 0 24 24" fill="none" stroke="#D96D00" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l8 3v6c0 4.5-3.4 8-8 9c-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2l4-4"/>
    </svg>
  </div>
  <div>
    <h1>AntiDroidVirus</h1>
    <p>Registra chi usa i permessi, segnala le app<br>sospette e controlla download e installazioni.</p>
    <div class="etichette"><span>Senza internet</span><span>Senza root</span><span>Shizuku facoltativo</span></div>
  </div>
</body></html>
