name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_PRIVATE_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    outputs:
      has_private_key: ${{ steps.key.outputs.has_private_key }}
    steps:
      - id: key
        run: echo "has_private_key=$HAS_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Chiave privata (facoltativa, dai secret del repository)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > app/release.jks
      - run: ./gradlew assembleRelease --stacktrace
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: antidroidvirus-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Pubblica APK nella release "latest"
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk antidroidvirus.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest antidroidvirus.apk --prerelease --target "$GITHUB_SHA" \
            --title "Ultima build (${GITHUB_REF_NAME})" \
            --notes "APK compilato da ${GITHUB_SHA}. Aprilo dal telefono e installalo."
      - name: Pubblica APK di prova nella release "anteprima"
        if: github.ref != 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk antidroidvirus-anteprima.apk
          gh release delete anteprima --yes --cleanup-tag || true
          gh release create anteprima antidroidvirus-anteprima.apk --prerelease --target "$GITHUB_SHA" \
            --title "Anteprima (${GITHUB_REF_NAME})" \
            --notes "APK di prova compilato da ${GITHUB_SHA}, non ancora in main."
      - name: Prepara il repository F-Droid
        # Gira a ogni push per verificarlo; senza chiave privata usa una chiave usa e getta e non pubblica.
        if: github.event_name == 'push'
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          # Il pacchetto apt è troppo vecchio per leggere gli APK di AGP 8: si usa l'ultima versione da pip.
          python3 -m venv "$RUNNER_TEMP/fdroid"
          "$RUNNER_TEMP/fdroid/bin/pip" install -q fdroidserver
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          if [ "$HAS_PRIVATE_KEY" = "true" ]; then
            export REPO_KEYSTORE="$PWD/app/release.jks" REPO_PASSWORD="$SIGNING_PASSWORD"
          else
            export REPO_KEYSTORE="$RUNNER_TEMP/prova.jks" REPO_PASSWORD="prova-$GITHUB_RUN_ID"
            keytool -genkeypair -keystore "$REPO_KEYSTORE" -alias antidroidvirus -keyalg RSA -keysize 2048 \
              -validity 30 -storepass "$REPO_PASSWORD" -keypass "$REPO_PASSWORD" -dname CN=prova
          fi
          mkdir -p fdroid/repo
          cp app/build/outputs/apk/release/app-release.apk "fdroid/repo/dev.antidroidvirus_${GITHUB_RUN_NUMBER}.apk"
          cd fdroid
          cat > config.yml <<CONFIG
          repo_url: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/repo
          repo_name: AntiDroidVirus
          repo_description: Aggiornamenti di AntiDroidVirus, compilati dalla GitHub Action del repository.
          sdk_path: ${ANDROID_HOME}
          apksigner: ${APKSIGNER}
          keystore: ${REPO_KEYSTORE}
          repo_keyalias: antidroidvirus
          keystorepass: {env: REPO_PASSWORD}
          keypass: {env: REPO_PASSWORD}
          keydname: CN=antidroidvirus
          CONFIG
          chmod 600 config.yml
          "$RUNNER_TEMP/fdroid/bin/fdroid" update --pretty
          ls -la repo
          mkdir -p ../site
          cp -r repo ../site/repo
          echo '<meta http-equiv="refresh" content="0; url=repo/">' > ../site/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.HAS_PRIVATE_KEY == 'true'
        with:
          path: site

  pages:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.has_private_key == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
