name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: antidroidvirus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Pubblica APK nella release "latest"
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk antidroidvirus.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest antidroidvirus.apk --prerelease --target "$GITHUB_SHA" \
            --title "Ultima build (${GITHUB_REF_NAME})" \
            --notes "APK debug compilato da ${GITHUB_SHA}. Aprilo dal telefono e installalo."
