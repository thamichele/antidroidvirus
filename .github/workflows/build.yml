name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Chiave privata (facoltativa, dai secret del repository)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > app/release.jks
      - run: ./gradlew assembleRelease --stacktrace
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: antidroidvirus-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Pubblica APK nella release "latest"
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk antidroidvirus.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest antidroidvirus.apk --prerelease --target "$GITHUB_SHA" \
            --title "Ultima build (${GITHUB_REF_NAME})" \
            --notes "APK compilato da ${GITHUB_SHA}. Aprilo dal telefono e installalo."
